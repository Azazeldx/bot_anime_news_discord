name: Jalanin Bot Berita

on:
  # Jadwal jalan otomatis (Cron Job)
  schedule:
    # Minta jalan setiap 15 menit (catatan: GitHub sering menunda jadwal cron di repo gratis)
    # Format: menit jam tanggal bulan hari
    - cron: '*/15 * * * *'

  # Tombol manual buat ngetes (biar ga nunggu jadwal)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Uji tanpa mengirim Discord atau mengubah history
        type: boolean
        default: false

permissions:
  contents: write # Izin supaya bot bisa update file history.json

# Jangan sampai 2 run jalan bersamaan (bisa kirim berita dobel & bentrok saat push history)
concurrency:
  group: bot-berita
  cancel-in-progress: false

jobs:
  run-news-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # RSSHub lokal untuk membaca akun X (login lewat cookie auth_token di secret TWITTER_AUTH_TOKEN).
    services:
      rsshub:
        # Dipin ke digest (tag latest 2026-10-07) karena container ini menerima cookie X; perbarui dengan sengaja.
        image: diygod/rsshub@sha256:7e2cbe4862d94480e927737cf52f5d8e0c60f14b79d2fc2f02ae6f698b51e75a
        ports:
          - 1200:1200
        env:
          NODE_ENV: production
          CACHE_TYPE: memory
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}

    steps:
      - name: Ambil Kodingan (Checkout)
        id: checkout
        uses: actions/checkout@v4
        with:
          # Run yang antre harus membaca history branch terbaru, bukan SHA saat jadwal dibuat.
          ref: ${{ github.ref_name }}

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Library
        run: pip install -r requirements.txt

      - name: Uji Regresi
        run: python -m unittest discover -s tests -v

      - name: Tunggu RSSHub Siap
        # Kalau RSSHub tidak siap, bot tetap jalan; akun X hanya dilewati.
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1200/healthz > /dev/null && echo "RSSHub siap" && exit 0
            sleep 2
          done
          echo "RSSHub belum siap setelah 60 detik"

      - name: Jalankan Bot
        env:
          # Ambil rahasia dari GitHub Secrets
          DISCORD_WEBHOOK_ORICON: ${{ secrets.DISCORD_WEBHOOK_ORICON }}
          DISCORD_WEBHOOK_GAME: ${{ secrets.DISCORD_WEBHOOK_GAME }}
          DISCORD_WEBHOOK_INDO: ${{ secrets.DISCORD_WEBHOOK_INDO }}
          DISCORD_WEBHOOK_BUZZ: ${{ secrets.DISCORD_WEBHOOK_BUZZ }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_LN: ${{ secrets.DISCORD_WEBHOOK_LN }}
          DISCORD_WEBHOOK_VTUBER: ${{ secrets.DISCORD_WEBHOOK_VTUBER }}
          DISCORD_WEBHOOK_ANN: ${{ secrets.DISCORD_WEBHOOK_ANN }}
          DISCORD_WEBHOOK_CRUNCHYROLL: ${{ secrets.DISCORD_WEBHOOK_CRUNCHYROLL }}
          DISCORD_WEBHOOK_JPGENERAL: ${{ secrets.DISCORD_WEBHOOK_JP_NEWS }}
          DISCORD_WEBHOOK_TWITTER: ${{ secrets.DISCORD_WEBHOOK_TWITTER }}
          # Channel kurasi berita berpotensi viral
          DISCORD_WEBHOOK_AREAANIME: ${{ secrets.DISCORD_WEBHOOK_AREAANIME }}
          # Terjemahan judul dan ringkasan melalui Gemini.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_REQUEST_INTERVAL: ${{ vars.GEMINI_REQUEST_INTERVAL || '6' }}
          # Kurasi Areaanime dinilai Gemini (pakai GEMINI_API_KEY di atas); Claude dipakai kalau key ini diisi
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AREAANIME_GEMINI_MODEL: ${{ vars.AREAANIME_GEMINI_MODEL }}
          # Bridge RSS akun X: RSSHub service di atas, kecuali secret X_RSS_URL diisi (RSSHub milik sendiri)
          X_RSS_URL: ${{ secrets.X_RSS_URL || 'http://localhost:1200/twitter/user/{account}' }}
          X_ACCOUNTS: ${{ vars.X_ACCOUNTS }}
          # Opsional: ganti daftar akun channel Twitter & batas umur postingan
          X_TWITTER_ACCOUNTS: ${{ vars.X_TWITTER_ACCOUNTS }}
          X_MAX_AGE_HOURS: ${{ vars.X_MAX_AGE_HOURS }}
        run: python -u main.py ${{ inputs.dry_run && '--dry-run' || '' }}
        timeout-minutes: 22

      - name: Simpan History (Commit & Push)
        # Langkah ini penting agar bot tidak lupa berita yang sudah dikirim.
        # Tetap jalan walau langkah bot gagal/timeout, supaya berita yang sudah terkirim tidak dikirim ulang.
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config --global user.name "Bot Berita Otomatis"
          git config --global user.email "bot@github.com"
          # Gabungkan kedua daftar kiriman ketika history berubah selama bot berjalan.
          git config merge.news-history.driver 'python history_store.py --merge "%A" "%B"'

          # Cek kalau ada perubahan di history.json
          if [[ -n $(git status -s history.json) ]]; then
            git add history.json
            git commit -m "Update history berita [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            done
            echo "Gagal push history setelah 3 percobaan."
            exit 1
          else
            echo "Tidak ada berita baru, tidak perlu save history."
          fi

      - name: Cadangkan History
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: news-history-${{ github.run_id }}
          path: history.json
          retention-days: 7
